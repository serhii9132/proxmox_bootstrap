---
- name: Update root password
  no_log: true
  ansible.builtin.user:
    name: root
    password: "{{ accounts_root_pass }}"
  when: accounts_root_pass | length > 0

- name: Apply .bashrc from template
  ansible.builtin.template:
    src: bashrc.j2
    dest: /root/.bashrc
    owner: root
    group: root
    mode: '644'

- name: Add authorized key to root
  no_log: true
  ansible.posix.authorized_key:
    user: root
    state: present
    key: "{{ accounts_root_ssh_pub_key }}"
    exclusive: true
  when: accounts_root_ssh_pub_key | length > 0
